[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-engineering-reference"
version = "2.0.0a0"
description = "Learning and reference platform for prompt engineering patterns, templates, resources, provider guidance, and evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT AND CC0-1.0" }
authors = [{ name = "Mert Gedik" }]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "jsonschema>=4.22", "detect-secrets>=1.5"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<9.8"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_configs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true
