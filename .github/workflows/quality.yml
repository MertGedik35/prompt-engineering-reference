name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,docs]"
      - run: python scripts/validate_catalog.py
      - run: python scripts/generate_docs_indexes.py --check
      - run: python scripts/check_internal_links.py
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy scripts tests
      - run: python -m pytest
      - run: python -m mkdocs build --strict
