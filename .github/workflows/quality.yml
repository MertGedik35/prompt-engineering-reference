name: Quality

on:
  push:
    branches: [main, feat/v2-learning-reference]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,docs]"
      - run: python scripts/validate_schemas.py
      - run: python scripts/validate_catalog.py
      - run: python scripts/check_content_quality.py
      - run: python scripts/audit_privacy.py --include-git --history-warn-only
      - run: python scripts/check_freshness.py
      - run: python scripts/generate_docs_indexes.py --check
      - run: python scripts/check_internal_links.py
      - run: python scripts/check_readme_navigation.py
      - run: python -m detect_secrets scan --all-files
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy scripts tests
      - run: python -m pytest
      - run: python -m mkdocs build --strict
      - run: make check
