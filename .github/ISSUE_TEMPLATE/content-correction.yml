name: Content correction
description: Report a factual or structural correction.
title: "[correction] "
labels: ["type: correction"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: File, URL, or catalog ID.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Requested change
      description: Describe the specific change and evidence.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Explain how the change can be checked.
    validations:
      required: true
