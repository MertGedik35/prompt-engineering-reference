site_name: Prompt Engineering Reference
site_description: Learn prompt engineering from first principles, then use a tested reference library.
site_url: https://mertgedik35.github.io/prompt-engineering-reference/
repo_url: https://github.com/MertGedik35/prompt-engineering-reference
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MertGedik35/prompt-engineering-reference
nav:
  - Home: index.md
  - Start Learning:
      - Overview: learn/index.md
      - Orientation: learn/orientation.md
      - LLM Foundations: learn/llm-foundations.md
      - Prompt Anatomy: learn/prompt-anatomy.md
      - Core Techniques: learn/core-techniques.md
      - Grounding and Long Context: learn/grounding-long-context.md
      - Structured Outputs: learn/structured-outputs.md
      - Evaluation: learn/evaluation.md
      - Agents and Tools: learn/agents-tools.md
      - Context Engineering: learn/context-engineering.md
      - Security: learn/security.md
      - Multimodal: learn/multimodal.md
      - Production Operations: learn/production-operations.md
      - Portfolio and Capstone: learn/portfolio-capstone.md
  - Prompt Reference:
      - Overview: reference/index.md
      - Patterns: generated/pattern-index.md
      - Templates: generated/template-index.md
      - Prompt Doctor: generated/prompt-doctor-index.md
      - Glossary: generated/glossary-index.md
      - Security checklist: reference/security-checklist.md
      - Provider selection: reference/provider-selection.md
  - Provider Guides:
      - Overview: providers/index.md
      - OpenAI: providers/openai.md
      - Anthropic Claude: providers/anthropic.md
      - Google Gemini: providers/google.md
      - Microsoft: providers/microsoft.md
      - AWS Bedrock: providers/aws.md
      - Meta Llama: providers/meta.md
      - Mistral AI: providers/mistral.md
      - Open Models: providers/open-models.md
  - Courses & Resources:
      - Overview: resources/index.md
      - Official Resources: generated/official-resource-index.md
      - Official Prompts: resources/official-prompts.md
      - Repositories: generated/repository-index.md
      - Courses: generated/course-index.md
      - Credentials: generated/credential-index.md
      - Videos: generated/video-index.md
      - Papers: generated/paper-index.md
      - Books: generated/book-index.md
      - Tools: generated/tool-index.md
      - Communities: generated/community-index.md
  - Practice & Labs:
      - Overview: labs/index.md
      - Exercises: labs/exercises.md
      - Quizzes: labs/quizzes.md
      - Solutions: labs/solutions.md
      - Evaluations: labs/evaluations.md
      - Datasets: labs/datasets.md
      - Capstones: labs/capstones.md
  - Contribute:
      - Contributing: contribute/index.md
  - Project:
      - V1 Content Audit: project/v1-content-audit.md
      - Privacy Audit: project/privacy-audit.md
      - V2 Architecture: project/v2-architecture.md
      - V2 Semantic Content Audit: project/v2-semantic-content-audit.md
      - V1 to V2 Migration: project/v1-to-v2-migration.md
      - V2 Release Gates: project/v2-release-gates.md
      - V2 Release Notes: project/v2-release-notes.md
      - V2 Development Record: project/v2-development-record.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
strict: true
