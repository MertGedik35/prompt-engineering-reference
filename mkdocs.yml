site_name: Prompt Engineering Reference
site_description: Practical prompt engineering patterns, templates, evaluations, and provider guidance.
site_url: https://mertgedik35.github.io/prompt-engineering-reference/
repo_url: https://github.com/MertGedik35/prompt-engineering-reference
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
nav:
  - Home: index.md
  - Research Positioning: research-positioning.md
  - Prompt Contract: prompt-contract.md
  - Patterns: patterns.md
  - Templates: templates.md
  - Evaluations: evaluations.md
  - Prompt Doctor: prompt-doctor.md
  - Provider Guides:
      - Overview: providers/index.md
      - OpenAI: providers/openai.md
      - Anthropic Claude: providers/anthropic.md
      - Google Gemini: providers/gemini.md
      - Microsoft Azure OpenAI: providers/azure-openai.md
      - Meta Llama: providers/llama.md
      - Mistral AI: providers/mistral.md
      - Amazon Bedrock: providers/amazon-bedrock.md
  - Context Engineering: context-engineering.md
  - Security: security.md
  - Resources: resources.md
  - Generated:
      - Pattern Index: generated/pattern-index.md
      - Template Index: generated/template-index.md
      - Resource Index: generated/resource-index.md
  - Contributing: contributing.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
strict: true
